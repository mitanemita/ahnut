# Сервер в Нидерландах: только вспомогательные сервисы «Ахнуть», рядом со вторым проектом.
#   - check.<домен> — браузер для самопроверки открыток «Принца» (Playwright server);
#   - llm.<домен>   — прокси к OpenRouter (нужен, только если OpenRouter недоступен с российского сервера).
# Оба принимают подключения ТОЛЬКО с IP российского сервера, по HTTPS, браузер — ещё и по секретному пути.
# Запуск: cp .env.example .env && nano .env && docker compose up -d --build
name: ahnut-nl

services:
  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  browser:
    build: ../../browser
    restart: unless-stopped
    init: true
    mem_limit: 1500m
    command: ["playwright", "run-server", "--port", "3000", "--host", "0.0.0.0",
              "--path", "/${BROWSER_SECRET_PATH}", "--max-clients", "2"]

volumes:
  caddy_data:
  caddy_config:
