{% extends "base.html" %}
{% block title %}Открытка — Ахнуть{% endblock %}
{% block head %}<meta name="robots" content="noindex">{% endblock %}
{% block body %}
<main class="hero">
  <p class="kicker">Тебе открытка</p>
  <h1 style="font-size:44px">Нужен пароль</h1>
  <p class="lead">Отправитель защитил открытку паролем. Его знаете только вы двое.</p>
  <form method="post" action="/c/{{ card_id }}" style="max-width:320px;margin:0 auto">
    <input class="field" name="password" type="password" autocomplete="off" placeholder="Пароль" autofocus>
    {% if error %}<p class="err">Пароль не подошёл</p>{% endif %}
    <button class="btn" type="submit" style="margin-top:12px;width:100%;border:0;font:inherit;font-weight:600">Открыть</button>
  </form>
</main>
{% endblock %}
