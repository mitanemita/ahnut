services:
  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDR: ${SITE_ADDR}
      REDIRECT_ADDRS: ${REDIRECT_ADDRS}
      N8N_ADDR: ${N8N_ADDR}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, n8n]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: alembic upgrade head
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      db: { condition: service_healthy }

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      PLAYWRIGHT_WS: ws://browser:3000/
    volumes:
      - files:/app/data/files   # фото и файлы открыток (на диске сервера, том Docker)
    depends_on:
      migrate: { condition: service_completed_successfully }
      browser: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Браузер для самопроверки открыток «Принца» по скриншоту на 375px (версия = playwright в requirements.txt)
  browser:
    build: ./browser
    restart: unless-stopped
    init: true
    mem_limit: 900m

  n8n:
    image: n8nio/n8n:2.20.12
    restart: unless-stopped
    mem_limit: 700m
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_LISTEN_ADDRESS: 0.0.0.0  # в Docker-сети часто нет IPv6
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      N8N_EDITOR_BASE_URL: ${N8N_PROTOCOL:-https}://${N8N_HOST}/
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-true}
      GENERIC_TIMEZONE: Europe/Moscow
      TZ: Europe/Moscow
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=512
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      db: { condition: service_healthy }

volumes:
  pg_data:
  n8n_data:
  caddy_data:
  caddy_config:
  files:
